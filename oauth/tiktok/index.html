<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TikTok connect</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #060917; color: #e5e7eb; font: 16px/1.5 -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 480px; padding: 32px 16px; text-align: center; }
  h1 { font-size: 28px; margin: 0 0 8px; color: #fff; }
  p { color: #bdbefb; margin: 0 0 24px; }
  code { display: block; word-break: break-all; background: #111827; border: 1px solid #477df6; border-radius: 12px; padding: 16px; color: #fff; font-size: 14px; }
  button { margin-top: 16px; background: #477df6; color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1 id="h">TikTok is connected</h1>
  <p id="p">Copy this code back to the chat that asked for it. It works once and runs out in a few minutes.</p>
  <code id="c"></code>
  <button id="b" type="button">Copy code</button>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const code = q.get('code');
  if (!code) {
    document.getElementById('h').textContent = 'TikTok did not connect';
    document.getElementById('p').textContent = q.get('error_description') || q.get('error') || 'No code came back.';
    document.getElementById('c').remove(); document.getElementById('b').remove();
  } else {
    document.getElementById('c').textContent = code + (q.get('state') ? '\nstate: ' + q.get('state') : '');
    document.getElementById('b').onclick = () => navigator.clipboard.writeText(code).then(() => { document.getElementById('b').textContent = 'Copied'; });
  }
  history.replaceState(null, '', location.pathname);
</script>
</body>
</html>
